<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agendar horário | Balde Lava Jato</title>
<meta name="description" content="Escolha o serviço, veja os horários livres e agende seu horário no Balde Lava Jato, em Santa Helena - MA.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--az:#1A10B5;--az2:#0B0680;--cy:#4DA3E8;--am:#FFD84A;--br:#fff;--tx:#10104a;--r:18px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:Nunito,system-ui,sans-serif;color:#fff;background:linear-gradient(180deg,var(--az),var(--az2));min-height:100vh;line-height:1.5}
h1,h2,h3,.bt{font-family:'Baloo 2',sans-serif;line-height:1.1}
h2{font-size:clamp(1.9rem,5vw,2.8rem);margin-bottom:.4em}
#marca{position:fixed;inset:0;z-index:0;display:grid;place-items:center;pointer-events:none}
#marca img{width:min(90vw,640px);opacity:.1}
.b{position:fixed;border-radius:50%;border:2px solid #fff4;background:radial-gradient(circle at 30% 30%,#fff6,#fff0 60%);z-index:0;pointer-events:none;animation:up linear infinite}
@keyframes up{from{transform:translateY(110vh)}to{transform:translateY(-20vh)}}
header,main,footer{position:relative;z-index:1}
header{position:sticky;top:0;z-index:20;background:#0B0680ee;backdrop-filter:blur(8px);display:flex;align-items:center;gap:14px;padding:8px 5vw}
header img{height:48px}
nav{margin-left:auto;display:flex;gap:18px}
nav a{color:#fff;text-decoration:none;font-weight:700}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--am);outline-offset:2px}
.btn{display:inline-block;border:0;cursor:pointer;font:800 1rem 'Baloo 2',sans-serif;padding:11px 22px;border-radius:99px;background:var(--am);color:var(--az2);text-decoration:none}
.btn.o{background:transparent;color:#fff;border:2px solid #fff}
.btn.w{background:#25D366;color:#fff}
.btn.s{padding:6px 14px;font-size:.9rem}
section{padding:64px 5vw;max-width:1100px;margin:auto}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;min-height:80vh}
.hero h1{font-size:clamp(2.4rem,7vw,4.6rem);font-weight:800}
.hero p{font-size:1.2rem;margin:16px 0 24px;max-width:46ch}
.hero img{width:100%;max-width:420px;justify-self:center;filter:drop-shadow(0 20px 30px #0008);animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:var(--br);color:var(--tx);border-radius:var(--r);padding:20px}
.card h3{font-size:1.4rem;color:var(--az)}
.pr{font-family:'Baloo 2';font-size:1.5rem;font-weight:800;margin:6px 0 10px}
.pr small{display:block;font:400 .85rem Nunito;opacity:.75}
.sel{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:420px;margin:18px 0}
.sel div{aspect-ratio:1;background:var(--az);border:2px solid var(--cy);border-radius:50%;display:grid;place-items:center;font:800 1rem 'Baloo 2';text-align:center}
.sel div.on{background:var(--am);color:var(--az2)}
.sel div.fr{border-radius:22%;background:var(--az2);border-color:var(--am)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:30px}
form{display:grid;gap:12px}
label{font-weight:700;font-size:.95rem}
input,select,textarea{width:100%;padding:11px 13px;border-radius:12px;border:2px solid #c9d6f5;font:inherit;color:var(--tx);background:#fff}
.st{display:flex;gap:4px}
.st button{background:none;border:0;font-size:2rem;color:#c9c9c9;cursor:pointer;line-height:1}
.st button.on{color:#f5b800}
.row{display:flex;gap:10px;flex-wrap:wrap}
.rev{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.rev .card p{margin:6px 0}
.wa{position:fixed;right:18px;bottom:18px;z-index:30;width:62px;height:62px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 6px 18px #0008;animation:pl 2s infinite}
.wa svg{width:34px;fill:#fff}
.wa span{position:absolute;right:72px;background:#fff;color:var(--tx);padding:5px 10px;border-radius:10px;font-weight:700;font-size:.85rem;white-space:nowrap;opacity:0;transition:.2s}
.wa:hover span,.wa:focus span{opacity:1}
@keyframes pl{0%{box-shadow:0 0 0 0 #25D366aa}70%{box-shadow:0 0 0 18px #25D3660}100%{box-shadow:0 0 0 0 #25D3660}}
.modal{position:fixed;inset:0;z-index:50;background:#050340ee;display:none;overflow:auto;padding:4vw}
.modal.on{display:block}
.box{background:#fff;color:var(--tx);max-width:900px;margin:auto;border-radius:var(--r);padding:24px;position:relative}
.box h2{color:var(--az);font-size:2rem}
.x{position:absolute;right:14px;top:10px;background:none;border:0;font-size:2rem;cursor:pointer;color:var(--tx)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.tabs .btn{background:#e6ecff;color:var(--az2)}
.tabs .btn.on{background:var(--az);color:#fff}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:7px;border-bottom:1px solid #dde;text-align:left}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kp div{background:#eef2ff;border-radius:14px;padding:14px}
.kp b{display:block;font:800 1.9rem 'Baloo 2';color:var(--az)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--am);color:var(--az2);padding:10px 20px;border-radius:99px;font-weight:700;z-index:99;display:none}
footer{text-align:center;padding:30px 5vw 90px;background:#0B0680cc}
footer img{height:70px}
footer a{color:var(--am)}
.mini{font-size:.85rem;opacity:.8}
@media(max-width:760px){nav{display:none}header .btn{margin-left:auto}.hero,.two{grid-template-columns:1fr}.hero img{max-width:260px;order:-1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto}}
.tl{border-left:3px solid var(--cy);padding-left:18px;display:grid;gap:14px;margin-top:10px}
.tl .card{position:relative}
.tl .card::before{content:"";position:absolute;left:-29px;top:22px;width:14px;height:14px;border-radius:50%;background:var(--am);border:3px solid var(--az2)}
.tl img,.tl video,.gl img{width:100%;max-height:280px;object-fit:cover;border-radius:12px;margin-top:8px}
.ig{position:fixed;right:18px;bottom:92px;z-index:30;width:52px;height:52px;border-radius:50%;background:linear-gradient(45deg,#f9a825,#e1306c,#833ab4);display:grid;place-items:center;box-shadow:0 6px 18px #0008}
.ig svg{width:28px;fill:none;stroke:#fff;stroke-width:2}
#srv{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.sv{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid #e5e9fb}
h3+.sv{border-top:0}.sv p{font-size:.9rem;opacity:.8}.sv .btn{flex:none}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:29;border:0;cursor:pointer;background:var(--am);color:var(--az2);font:800 .95rem 'Baloo 2',sans-serif;padding:12px 20px;border-radius:99px;box-shadow:0 6px 18px #0008;white-space:nowrap}
.btn[disabled]{opacity:.5;cursor:not-allowed}
#agB h2{font-size:1.5rem}
.op{display:flex;gap:10px;align-items:center;border:2px solid #dfe6fb;border-radius:14px;padding:10px 12px;margin:6px 0;cursor:pointer}
.op.on{border-color:var(--az);background:#eef2ff}.op input{width:20px;height:20px;flex:none}
.chip{border:2px solid #c9d6f5;background:#fff;color:var(--tx);border-radius:99px;padding:6px 16px;font:700 .95rem Nunito,sans-serif;cursor:pointer}
.chip.on{background:var(--az);color:#fff;border-color:var(--az)}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-top:12px}
.foot{position:sticky;bottom:0;background:#fff;padding:12px 0 2px;margin-top:12px}.foot .btn{width:100%}
.agh{display:flex;gap:10px;align-items:center;margin-bottom:8px}.x2{background:none;border:0;font-size:1.6rem;cursor:pointer;color:var(--az)}
.ok{width:64px;height:64px;border-radius:50%;background:#22c55e;color:#fff;font-size:2.2rem;display:grid;place-items:center;margin:0 auto 8px}
details{background:#fff;color:var(--tx);border-radius:14px;padding:12px 16px;margin:8px 0}
summary{cursor:pointer;font-weight:700}details p{margin:8px 0 0}
.pass{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:10px 0 24px}
.pass div{background:#ffffff1f;border-radius:16px;padding:14px;font-size:.95rem}
.pass b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--am);color:var(--az2);margin-bottom:6px}
.ul{padding-left:18px;margin:6px 0 0}.ul li{margin:4px 0}

main section{padding:28px 5vw 110px}.box{margin:0 auto}
</style></head><body>
